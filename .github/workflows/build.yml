name: build

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  schedule:
    # nightly, to pick up base-image/toolchain updates (before laptop-setup's 08:17)
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laptopd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          podman build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:44-${{ steps.tag.outputs.date }}" \
            -f Containerfile .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        run: |
          podman push "$IMAGE:latest"
          podman push "$IMAGE:44-${{ steps.tag.outputs.date }}"

# One-time setup after the first successful run (not automated):
#   github.com/oshox?tab=packages -> laptopd -> Package settings
#   -> Change visibility -> Public. The repo stays private; the image holds
#   no secrets, and the laptop needs no registry login to `bootc upgrade`.
